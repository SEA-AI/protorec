name: Code Quality

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # need to go first as it cleans the directory
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/ruff-action@v3
      - run: ruff check --fix
      - run: ruff format
      # Commit all changed files back to the repository
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply ruff changes
