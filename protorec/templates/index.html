<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEA.AI REC</title>
    <style>
        /* General Styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            color: #333;
            margin: 16px 0;
        }

        /* Status Box */
        .status-container {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.15);
        width: calc(100% - 40px); /* Use the full window width */
        box-sizing: border-box;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start; /* Align content at the top */
        }

        /* Status, info and button share one row to leave room for the feed */
        .toolbar {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

            /* Camera Feed Styling */
        .viewer {
        --aspect: 1.7778; /* Frame width / height, updated from the first frame */
        position: relative;
        /* Largest size that fits the window at the frame's aspect ratio */
        width: max(200px, min(100%, calc((100vh - 200px) * var(--aspect))));
        aspect-ratio: var(--aspect);
        }

        #cameraFeed {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 8px;
        box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
        user-select: none;
        }

        #cameraFeed.zoomed {
        cursor: grab;
        touch-action: none; /* Pan with touch instead of scrolling the page */
        }

        #cameraFeed.dragging {
        cursor: grabbing;
        }

        /* Zoom Controls */
        .zoom-controls {
            position: absolute;
            right: 10px;
            bottom: 10px;
            display: flex;
            gap: 6px;
        }

        .zoom-controls button {
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 20px;
            border-radius: 6px;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .zoom-controls button:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .zoom-controls #zoomLevel {
            width: 60px;
            font-size: 14px;
        }

        #status {
            font-size: 18px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            min-width: 160px;
            box-sizing: border-box; /* Ensures padding is included in width */
        }

        .recording {
            color: #dc3545;
            background-color: rgba(220, 53, 69, 0.1);
        }

        .idle {
            color: #28a745;
            background-color: rgba(40, 167, 69, 0.1);
        }

        /* Recording Info */
        #info {
            font-size: 16px;
            color: #555;
        }

        /* Button Styling */
        .button-container {
            display: flex;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            width: 220px;
            font-weight: bold;
            display: block;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            cursor: not-allowed;
            box-shadow: none;
        }

        .start {
            background-color: #28a745;
        }

        .start:hover:not(:disabled) {
            background-color: #218838;
        }

        .start:disabled {
            background-color: #28a745;
        }

        .stop {
            background-color: #dc3545;
        }

        .stop:hover:not(:disabled) {
            background-color: #c82333;
        }

        .stop:disabled {
            background-color: #dc3545;
        }

    </style>
    <script>
        let recordingInterval = null;

        async function fetchState() {
            const response = await fetch('/get_state');
            const data = await response.json();
            return data;
        }

        async function initializeUI() {
            const button = document.getElementById("recordButton");
            const status = document.getElementById("status");
            const info = document.getElementById("info");

            const data = await fetchState();
            const isRecording = data.is_recording;
            const diskUsage = data.disk_usage;
            const recordingDuration = data.recording_duration;

            if (isRecording) {
                button.textContent = "Stop Recording";
                button.dataset.action = "stop";
                button.classList.add("stop");
                button.classList.remove("start");
                status.textContent = "Recording...";
                status.classList.add("recording");
                status.classList.remove("idle");
                updateRecordingInfo(recordingDuration, diskUsage);
                recordingInterval = setInterval(updateDurationUI, 1000);
            } else {
                button.textContent = "Start Recording";
                button.dataset.action = "start";
                button.classList.add("start");
                button.classList.remove("stop");
                status.textContent = "Idle";
                status.classList.add("idle");
                status.classList.remove("recording");
                clearInterval(recordingInterval);
                recordingInterval = null;
                info.innerHTML = `Used Space: <span id="used-space">${diskUsage.used.toFixed(2)}</span> GB <br> 
                                  Free Space: <span id="free-space">${diskUsage.free.toFixed(2)}</span> GB`;
            }
        }

        function updateRecordingInfo(duration, diskUsage) {
            const info = document.getElementById("info");
            if (duration !== null && diskUsage) {
                info.innerHTML = `Recording Time: <span id="recording-time">${formatTime(duration)}</span><br>
                                  Used Space: <span id="used-space">${diskUsage.used.toFixed(2)}</span> GB<br>
                                  Free Space: <span id="free-space">${diskUsage.free.toFixed(2)}</span> GB`;
            }
        }

        async function updateDurationUI() {
            const data = await fetchState();
            if (data.is_recording && data.recording_duration !== null) {
                document.getElementById("recording-time").textContent = formatTime(data.recording_duration);
                document.getElementById("free-space").textContent = data.disk_usage.free.toFixed(2);
                document.getElementById("used-space").textContent = data.disk_usage.used.toFixed(2);
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}m ${secs}s`;
        }

        async function handleButtonClick() {
            const button = document.getElementById("recordButton");
            button.disabled = true;

            const action = button.dataset.action;
            const url = action === "start" ? "/start_recording" : "/stop_recording";

            await fetch(url, { method: 'POST' });
            await initializeUI();

            button.disabled = false;
        }

        const MAX_ZOOM = 8;
        const ZOOM_STEP = 1.5;
        const FRAME_INTERVAL_MS = 200; // 5 fps

        // Zoom factor and visible center, as fractions of the full frame
        const view = { zoom: 1, cx: 0.5, cy: 0.5 };
        let drag = null;
        let frameLoading = false;
        let framePending = false;
        let frameZoom = 1; // Zoom of the frame being loaded

        function updateFrame() {
            // Wait for the current frame so zoom changes don't pile up requests
            if (frameLoading) {
                framePending = true;
                return;
            }
            frameLoading = true;
            frameZoom = view.zoom;
            const params = new URLSearchParams({
                zoom: view.zoom,
                cx: view.cx,
                cy: view.cy,
                t: Date.now(), // Prevents caching
            });
            document.getElementById("cameraFeed").src = `/frame?${params}`;
        }

        function onFrameDone() {
            const img = document.getElementById("cameraFeed");
            // Crops are rounded to whole pixels, so only full frames set the aspect
            if (frameZoom === 1 && img.naturalWidth > 0) {
                img.parentElement.style.setProperty("--aspect", img.naturalWidth / img.naturalHeight);
            }
            frameLoading = false;
            if (framePending) {
                framePending = false;
                updateFrame();
            }
        }

        function setView(zoom, cx, cy) {
            view.zoom = Math.min(Math.max(zoom, 1), MAX_ZOOM);
            const half = 0.5 / view.zoom;
            view.cx = Math.min(Math.max(cx, half), 1 - half);
            view.cy = Math.min(Math.max(cy, half), 1 - half);

            document.getElementById("zoomLevel").textContent = `${view.zoom.toFixed(1)}×`;
            document.getElementById("cameraFeed").classList.toggle("zoomed", view.zoom > 1);
            updateFrame();
        }

        // Zoom by factor, keeping the frame point at image position (u, v) in place
        function zoomAt(factor, u = 0.5, v = 0.5) {
            const x = view.cx + (u - 0.5) / view.zoom;
            const y = view.cy + (v - 0.5) / view.zoom;
            const zoom = Math.min(Math.max(view.zoom * factor, 1), MAX_ZOOM);
            setView(zoom, x - (u - 0.5) / zoom, y - (v - 0.5) / zoom);
        }

        function resetZoom() {
            setView(1, 0.5, 0.5);
        }

        function initializeViewer() {
            const img = document.getElementById("cameraFeed");

            img.addEventListener("wheel", (event) => {
                event.preventDefault();
                const rect = img.getBoundingClientRect();
                const deltaY = event.deltaMode === 1 ? event.deltaY * 40 : event.deltaY;
                zoomAt(
                    Math.exp(-deltaY / 500),
                    (event.clientX - rect.left) / rect.width,
                    (event.clientY - rect.top) / rect.height,
                );
            }, { passive: false });

            img.addEventListener("pointerdown", (event) => {
                if (view.zoom <= 1) return;
                drag = { x: event.clientX, y: event.clientY, cx: view.cx, cy: view.cy };
                img.setPointerCapture(event.pointerId);
                img.classList.add("dragging");
            });

            img.addEventListener("pointermove", (event) => {
                if (!drag) return;
                const rect = img.getBoundingClientRect();
                setView(
                    view.zoom,
                    drag.cx - (event.clientX - drag.x) / rect.width / view.zoom,
                    drag.cy - (event.clientY - drag.y) / rect.height / view.zoom,
                );
            });

            const endDrag = () => {
                drag = null;
                img.classList.remove("dragging");
            };
            img.addEventListener("pointerup", endDrag);
            img.addEventListener("pointercancel", endDrag);

            updateFrame();
            // Skipped while a frame is loading, so slow links get fewer fps
            setInterval(updateFrame, FRAME_INTERVAL_MS);
        }

        document.addEventListener("DOMContentLoaded", initializeUI);
        document.addEventListener("DOMContentLoaded", initializeViewer);
    </script>
</head>
<body>
    <h1>SEA.AI Recorder</h1>
    <div class="status-container">
        <div class="toolbar">
            <div id="status" class="idle">Idle</div>
            <div id="info">Used Space: -- GB<br> Free Space: -- GB</div>
            <div class="button-container">
                <button id="recordButton" data-action="start" class="start" onclick="handleButtonClick()">Start Recording</button>
            </div>
        </div>
        <div class="viewer">
            <img id="cameraFeed" alt="Camera Feed" draggable="false"
                 title="Scroll to zoom, drag to pan"
                 onload="onFrameDone()" onerror="onFrameDone()">
            <div class="zoom-controls">
                <button title="Zoom out" onclick="zoomAt(1 / ZOOM_STEP)">&minus;</button>
                <button id="zoomLevel" title="Reset zoom" onclick="resetZoom()">1.0×</button>
                <button title="Zoom in" onclick="zoomAt(ZOOM_STEP)">+</button>
            </div>
        </div>
    </div>
</body>
</html>
